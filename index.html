<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fullerton College OIE Reports</title>
  <style>
    body {
      font-family: "Century Gothic", Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      line-height: 1.6;
    }
    h1 {
      color: #0F406B;
      border-bottom: 2px solid #0F406B;
      padding-bottom: 0.3em;
    }
    ul {
      list-style-type: none;
      padding-left: 1em;
    }
    li {
      margin: 0.3em 0;
    }
    a {
      color: #0F406B;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>Fullerton College Office of Institutional Effectiveness</h1>
<p>
  This compiles all <strong>Report.html</strong>, <strong>Report.pdf</strong>,
  <strong>Report.docx</strong>, and section <strong>index.html</strong> files
  across this repository:
</p>

<ul id="repo-contents"></ul>

<script>
  const repoOwner = "fc-oie";
  const repoName = "docs";
  const apiBase = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

  async function findReports(path = "", parentElement = null) {
    try {
      const response = await fetch(apiBase + path);
      const items = await response.json();
      if (!Array.isArray(items)) return;

      const ul = document.createElement("ul");

      for (const item of items) {
        if (item.type === "dir") {
          await findReports(path + item.name + "/", ul);

        } else if (
          /^report\.(html|pdf|docx)$/i.test(item.name) ||
          (
            /^index\.html$/i.test(item.name) &&
            (path + item.name) !== "index.html"
          )
        ) {
          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = path + item.name;
          link.textContent =
            path.replace(/\/$/, "") + " → " + item.name;

          li.appendChild(link);
          ul.appendChild(li);
        }
      }

      if (ul.children.length > 0) {
        (parentElement || document.getElementById("repo-contents"))
          .appendChild(ul);
      }

    } catch (err) {
      console.error("Error loading contents:", err);
    }
  }

  findReports();
</script>

</body>
</html>
