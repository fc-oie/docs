<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fullerton College OIE Reports</title>

  <style>
    body {
      font-family: "Century Gothic", Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      line-height: 1.6;
    }

    h1 {
      color: #0F406B;
      border-bottom: 2px solid #0F406B;
      padding-bottom: 0.3em;
    }

    ul {
      list-style-type: none;
      padding-left: 1em;
    }

    li {
      margin: 0.3em 0;
    }

    a {
      color: #0F406B;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .folder {
      font-weight: bold;
      margin-top: 0.75em;
    }
  </style>
</head>

<body>
  <h1>Fullerton College Office of Institutional Effectiveness</h1>

  <p>
    This compiles all <strong>index.html</strong> and
    <strong>report.*</strong> files across the repository.
  </p>

  <ul id="repo-contents"></ul>

  <script>
    const repoOwner = "fc-oie";
    const repoName = "docs";
    const apiBase = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

    async function walkRepo(path, container) {
      const response = await fetch(apiBase + path);
      const items = await response.json();
      if (!Array.isArray(items)) return;

      for (const item of items) {
        if (item.type === "dir") {
          const folderLi = document.createElement("li");
          folderLi.className = "folder";
          folderLi.textContent = item.name;

          const subUl = document.createElement("ul");
          folderLi.appendChild(subUl);
          container.appendChild(folderLi);

          await walkRepo(path + item.name + "/", subUl);

        } else if (
          /^index\.html$/i.test(item.name) ||
          /^report\.(html|pdf|docx)$/i.test(item.name)
        ) {
          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = path + item.name;
          link.textContent = item.name;

          li.appendChild(link);
          container.appendChild(li);
        }
      }
    }

    walkRepo("", document.getElementById("repo-contents"));
  </script>
</body>
</html>
