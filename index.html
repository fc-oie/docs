<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fullerton College OIE Reports</title>

  <style>
    body {
      font-family: "Century Gothic", Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      line-height: 1.6;
    }

    h1 {
      color: #0F406B;
      border-bottom: 2px solid #0F406B;
      padding-bottom: 0.3em;
    }

    .entry {
      margin-bottom: 0.6em;
    }

    a {
      color: #0F406B;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>Fullerton College Office of Institutional Effectiveness</h1>

  <p>
    This lists all folders containing a <strong>report</strong> file.
  </p>

  <div id="repo-contents"></div>

  <script>
    const repoOwner = "fc-oie";
    const repoName = "docs";
    const apiBase = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

    // Collect results first (data-only)
    async function collectReports(path = "", trail = []) {
      const response = await fetch(apiBase + path);
      const items = await response.json();
      if (!Array.isArray(items)) return [];

      let results = [];

      for (const item of items) {
        if (item.type === "dir") {
          const subResults = await collectReports(
            path + item.name + "/",
            [...trail, item.name]
          );
          results = results.concat(subResults);

        } else if (
          /^report\.(html|pdf|docx)$/i.test(item.name)
        ) {
          results.push({
            trail: trail,
            file: item.name,
            path: item.path
          });
        }
      }

      return results;
    }

    async function buildIndex() {
      const container = document.getElementById("repo-contents");
      const entries = await collectReports();

      // Alphabetical sort by full path
      entries.sort((a, b) =>
        a.trail.join("/").localeCompare(b.trail.join("/"))
      );

      for (const entry of entries) {
        const div = document.createElement("div");
        div.className = "entry";

        const link = document.createElement("a");
        link.href = entry.path;
        link.textContent =
          entry.trail.join(" → ") + " → " + entry.file;

        div.appendChild(link);
        container.appendChild(div);
      }
    }

    buildIndex();
  </script>
</body>
</html>
