<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fullerton College OIE Reports</title>

  <style>
    body {
      font-family: "Century Gothic", Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      line-height: 1.6;
    }

    h1 {
      color: #0F406B;
      border-bottom: 2px solid #0F406B;
      padding-bottom: 0.3em;
    }

    ul {
      list-style-type: none;
      padding-left: 1em;
    }

    li {
      margin: 0.3em 0;
    }

    a {
      color: #0F406B;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .folder {
      font-weight: bold;
      margin-top: 0.75em;
    }
  </style>
</head>

<body>
  <h1>Fullerton College Office of Institutional Effectiveness</h1>

  <p>
    Maybe this compiles all <strong>Report.html</strong>,
    <strong>Report.pdf</strong>,
    <strong>Report.docx</strong>, and
    <strong>index.html</strong> files across this repository:
  </p>

  <ul id="repo-contents"></ul>

  <script>
    const repoOwner = "fc-oie";
    const repoName = "docs";
    const apiBase = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

    async function findReports(path = "", parentElement) {
      const response = await fetch(apiBase + path);
      const items = await response.json();
      if (!Array.isArray(items)) return;

      let sectionUl = document.createElement("ul");
      let hasContent = false;

      for (const item of items) {
        if (item.type === "dir") {
          const folderLi = document.createElement("li");
          folderLi.className = "folder";
          folderLi.textContent = path + item.name;

          const childUl = document.createElement("ul");
          await findReports(path + item.name + "/", childUl);

          if (childUl.children.length > 0) {
            folderLi.appendChild(childUl);
            sectionUl.appendChild(folderLi);
            hasContent = true;
          }

        } else if (
          /^report\.(html|pdf|docx)$/i.test(item.name) ||
          /^index\.html$/i.test(item.name)
        ) {
          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = path + item.name;
          link.textContent = item.name;

          li.appendChild(link);
          sectionUl.appendChild(li);
          hasContent = true;
        }
      }

      if (hasContent) {
        parentElement.appendChild(sectionUl);
      }
    }

    findReports("", document.getElementById("repo-contents"));
  </script>
</body>
</html>
